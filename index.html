<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/marie_bg_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medical Report Information Extractor</title>
    <script type="module">
      // Register the COOP/COEP shim so multi-threaded OCR (SharedArrayBuffer)
      // works on static hosts (e.g. GitHub Pages) that cannot send the headers
      // themselves. In dev/preview, Vite sends the headers directly and the
      // shim detects isolation and does nothing.
      //
      // Force `credentialless` COEP: cross-origin model weight downloads from
      // HuggingFace CDN carry no Cross-Origin-Resource-Policy, so `require-corp`
      // would block them. `credentialless` keeps isolation on (and the threads
      // multi-threaded ORT needs) while allowing no-credentials cross-origin
      // subresource fetches. Matches the dev/preview headers in vite.config.js.
      window.coi = { coepCredentialless: () => true };
      if ('serviceWorker' in navigator && window.isSecureContext) {
        const s = document.createElement('script');
        s.src = new URL(import.meta.env.BASE_URL + 'coi-serviceworker.js', location.href).href;
        document.head.appendChild(s);
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
