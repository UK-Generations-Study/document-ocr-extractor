# Presidio analyzer for the de-identification feature, in DEVELOPMENT.
#
#   docker compose -f docker/presidio/compose.yaml up -d --build
#
# The analyzer is built from ./Dockerfile (clinical model + UK recognizers).
# Only the analyzer is needed: it finds the PII spans, and the app derives the
# redacted text from them itself (src/deid/deidentify.js), byte-identically to
# what the anonymizer's `replace` operator would have returned. Nothing in the
# app calls /anonymize, so that service is not run.
#
# Port 5002 matches the app's default dev proxy (see vite.config.js):
#   5002 -> analyzer    (/analyze, /supportedentities, /health)
#
# It binds to 127.0.0.1 only. This service accepts unauthenticated requests
# and would happily analyze anything sent to it, so it should not be reachable
# from outside the host.
#
# For the air-gapped deployment, see compose.yaml in the repo root instead -
# there the analyzer publishes no port at all and is reached only through the
# app container's nginx.

services:
  analyzer:
    build: .
    image: document-ocr-extractor-presidio:latest
    container_name: presidio-analyzer
    restart: unless-stopped
    ports:
      - "127.0.0.1:5002:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')"]
      interval: 30s
      timeout: 10s
      # Startup is quick in practice (~5s), but half a gigabyte of model
      # weights off a slow disk could take longer elsewhere. Headroom is free.
      start_period: 120s
      retries: 3
