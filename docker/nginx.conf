# Static server for the air-gapped Document OCR Extractor image.
#
# Two things matter here beyond plain file serving:
#
#  1. Cross-origin isolation. The OCR engines use SharedArrayBuffer
#     (multi-threaded ONNX Runtime, wllama). Browsers only expose it on a
#     cross-origin-isolated page, which needs BOTH headers below. Without them
#     the app loads but OCR refuses to start.
#
#  2. nginx's add_header inheritance. A location block that declares ANY
#     add_header drops every add_header inherited from the server block. So the
#     isolation headers are repeated in each location that sets its own - do
#     not "tidy" them away.
#
# Serve over http://localhost:<port>. localhost is a secure context, so no TLS
# is needed; reaching this over plain HTTP from another machine would NOT be a
# secure context and OCR would not run.
#
# This also reverse-proxies /presidio to the analyzer container, the same job
# the Vite dev server does in development (see vite.config.js). Presidio sends
# no CORS headers, so the browser can only reach it same-origin.

# Docker's embedded DNS, for the analyzer lookup below.
resolver 127.0.0.11 valid=30s ipv6=off;

types {
    application/wasm  wasm;
    # ONNX graphs, their external weight sidecars, and GGUF model files.
    application/octet-stream  onnx data gguf;
}

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    autoindex    off;

    # Large model files: stream them efficiently and don't buy anything by
    # compressing already-compressed weights.
    sendfile        on;
    tcp_nopush      on;
    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Cross-Origin-Opener-Policy   "same-origin"    always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    # Model weights: pinned by revision and vendored into the image, so they
    # never change for the life of the container. Cache hard.
    location /models/ {
        add_header Cross-Origin-Opener-Policy   "same-origin"    always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Vite emits content-hashed filenames here, so they're immutable too.
    location /assets/ {
        add_header Cross-Origin-Opener-Policy   "same-origin"    always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The shell itself: revalidate so a rebuilt image is picked up promptly.
    location = /index.html {
        add_header Cross-Origin-Opener-Policy   "same-origin"    always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cache-Control "no-cache" always;
    }

    # De-identification. Forwarded to the analyzer container, which publishes
    # no port of its own - it is reachable only from here, over compose's
    # internal network. /analyze, /supportedentities and /health all land here.
    #
    # The upstream is held in a VARIABLE deliberately. nginx resolves a literal
    # hostname once, at startup, and refuses to start if it does not resolve -
    # so a container that boots before the analyzer would die and stay dead. A
    # variable defers the lookup to request time, so start order stops
    # mattering and the proxy recovers on its own once the analyzer is up.
    # `rewrite ... break` strips the /presidio prefix, because the URI part of
    # a proxy_pass is ignored when the target contains a variable.
    location /presidio/ {
        add_header Cross-Origin-Opener-Policy   "same-origin"    always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        set $analyzer analyzer:3000;
        rewrite ^/presidio/(.*)$ /$1 break;
        proxy_pass http://$analyzer;
        proxy_set_header Host $host;
        # The transformer is loaded lazily on the first /analyze call, which
        # can take a couple of minutes on a cold container.
        proxy_connect_timeout 10s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;
    }

    # Everything else is a real file (schemas, ort/, wllama-patched/, the COI
    # shim). Deliberately NO SPA fallback: the app has no client-side routes,
    # and rewriting a missing model/asset to index.html would hand the browser
    # HTML where it expects a binary - the confusing failure mode we want a
    # plain 404 for instead.
    location / {
        try_files $uri $uri/ =404;
    }
}
